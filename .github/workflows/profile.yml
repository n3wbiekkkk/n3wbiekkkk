name: Refresh profile graphics

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_activity.py
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Render contribution statistics
        run: python3 scripts/update_activity.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions.svg?color_snake=#f5f5f5&color_dots=#171717,#3b3b3b,#686868,#aaaaaa,#f5f5f5
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save updated graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity-mono.svg assets/activity-mobile.svg assets/contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile activity and contribution snake'
            git push
          fi
