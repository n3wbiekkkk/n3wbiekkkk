  <text x="48" y="446" font-size="23" font-weight="700">Thai</text>
  <text x="440" y="414" class="mono muted" style="font-size:12px">SOLUTION LANGUAGES</text>
  <text x="440" y="446" font-size="23" font-weight="700">Python · C · C++</text>
  <text x="840" y="414" class="mono muted" style="font-size:12px">COMPETITION</text>
