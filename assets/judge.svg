<text x="44" y="130" font-size="68" font-weight="800" letter-spacing="-3" fill="#f5f5f5">Newbiegrader<tspan fill="#f5f5f5">.</tspan></text>
<text x="48" y="175" font-size="22" fill="#b8b8b8">Programming practice. In Thai.</text><text x="48" y="208" font-size="17" fill="#999999">Problems, automatic judging &amp; timed contests.</text>
