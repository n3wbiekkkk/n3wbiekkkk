<text x="32" y="195" font-size="30" font-weight="600" letter-spacing="-.8">Programming practice in Thai.</text>
<text x="32" y="237" font-size="23" class="muted">Thai-language programming problems</text>
<text x="32" y="267" font-size="23" class="muted">and automated solution evaluation.</text>
