<svg xmlns="http://www.w3.org/2000/svg" width="660" height="760" viewBox="0 0 660 760" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Newbiegrader — programming practice, in Thai</title>
<desc id="desc">Current project: Thai programming problems, automatic solution judging, and automated solution evaluation. Supports Python, C, and C++. The example submission is an illustration.</desc>
